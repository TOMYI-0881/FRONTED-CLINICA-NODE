<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Tomyi | Turnos</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
      }
      #boot-splash .boot-brand {
        display: flex;
        align-items: baseline;
        gap: 12px;
        animation: boot-fade 0.5s ease-out both;
      }
      @keyframes boot-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Splash estatico e inline: evita la pantalla en blanco en redes lentas/moviles
           mientras carga el JS. createRoot reemplaza su contenido al montar AppLoader. -->
      <div id="boot-splash">
        <div class="boot-brand">
          <span
            style="font-family: 'Montserrat Alternates', system-ui, sans-serif; font-weight: 700; font-size: 60px; line-height: 1; color: #171717; white-space: nowrap;"
            >Tomyi |</span
          >
          <span
            style="font-family: 'Montserrat Alternates', system-ui, sans-serif; font-weight: 400; font-size: 30px; line-height: 1.2; color: #52525b; padding: 0 8px; white-space: nowrap;"
            >Salud</span
          >
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
